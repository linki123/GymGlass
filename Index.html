<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Deborita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #ff6fa5;
    --pink-dark: #e0407e;
    --yellow: #ffd23f;
    --yellow-dark: #f7a800;
    --bg1: #fff0f5;
    --bg2: #ffe0ec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    font-family: 'Poppins', sans-serif;
    position: relative;
    padding: env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);
    text-align: center;
  }

  h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.2rem, 8vw, 4.5rem);
    color: var(--pink-dark);
    margin: 0 0 40px;
    text-shadow: 0 2px 10px rgba(224,64,126,0.25);
    z-index: 5;
    animation: floatTitle 4s ease-in-out infinite;
    position: relative;
  }
  @keyframes floatTitle {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  #loveBtn {
    z-index: 5;
    position: relative;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: white;
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    border: none;
    padding: 18px 42px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(224,64,126,0.45);
    transition: transform .25s ease, box-shadow .25s ease, opacity .5s ease;
    letter-spacing: .5px;
  }
  #loveBtn:hover { transform: scale(1.06); box-shadow: 0 10px 30px rgba(224,64,126,0.55); }
  #loveBtn:active { transform: scale(0.95); }
  #loveBtn.hide { opacity: 0; pointer-events: none; transform: scale(0.6); }

  /* ---------- particle scene ---------- */
  #scene { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }

  .heart {
    position: absolute;
    bottom: -40px;
    font-size: 22px;
    opacity: 0;
    animation: riseHeart linear forwards;
    filter: drop-shadow(0 2px 4px rgba(224,64,126,.4));
  }
  @keyframes riseHeart {
    0% { opacity: 0; transform: translateY(0) translateX(0) scale(0.5) rotate(0deg); }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-100vh) translateX(var(--drift,0px)) scale(1.1) rotate(var(--spin,20deg)); }
  }

  .burst-heart {
    position: fixed; left: 50%; top: 60%; font-size: 26px; opacity: 0; z-index: 6;
    animation: burst 1.1s ease-out forwards; pointer-events:none;
  }
  @keyframes burst {
    0% { opacity: 1; transform: translate(-50%,-50%) scale(0.4) rotate(0deg); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--bx,0px)), calc(-50% + var(--by,0px))) scale(1.3) rotate(var(--brot,0deg)); }
  }

  .sparkle {
    position: fixed; z-index: 6; pointer-events:none; font-size: 18px; opacity: 0;
    animation: sparkle 1s ease-out forwards;
  }
  @keyframes sparkle {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0); }
    30% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
  }

  /* ground flowers scattered on arrival */
  .ground-flower {
    position: fixed; bottom: 2%; font-size: 26px; z-index: 4; opacity: 0;
    animation: popFlower .6s ease forwards;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.15));
  }
  @keyframes popFlower {
    0% { opacity: 0; transform: translateY(20px) scale(0.3) rotate(-20deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }

  /* ---------- DOG ---------- */
  #dogStage { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }

  #dogWrap {
    position: fixed;
    left: 50%;
    top: 18%;
    width: 260px;
    transform: translate(-50%,-50%) scale(0.14);
    opacity: 0;
  }
  #dogWrap.run {
    animation: approach 1.7s cubic-bezier(.24,.86,.32,1.05) forwards;
  }
  @keyframes approach {
    0%   { top: 16%; transform: translate(-50%,-50%) scale(0.12); opacity: 0; }
    8%   { opacity: 1; }
    100% { top: 74%; transform: translate(-50%,-50%) scale(1.55); opacity: 1; }
  }

  #dogSvg { width: 100%; height: auto; display:block; overflow: visible; }

  /* running legs quick alternating motion */
  #dogWrap.run #legFF, #dogWrap.run #legBR { animation: legSwingA .22s ease-in-out infinite; }
  #dogWrap.run #legBF, #dogWrap.run #legFR { animation: legSwingB .22s ease-in-out infinite; }
  @keyframes legSwingA {
    0%,100% { transform: rotate(28deg); }
    50% { transform: rotate(-28deg); }
  }
  @keyframes legSwingB {
    0%,100% { transform: rotate(-28deg); }
    50% { transform: rotate(28deg); }
  }
  #dogWrap.run #dogSvg { animation: bob .22s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-4px);} }

  .sit-part { display: none; }
  #dogWrap.arrived .sit-part { display: inline; }
  #dogWrap.arrived .run-part { display: none; }
  #dogWrap.arrived #dogSvg { animation: none; transform: none; }

  #tail { transform-origin: 95px 150px; }
  #dogWrap.arrived #tail { animation: wag 0.45s ease-in-out infinite; }
  @keyframes wag {
    0%,100% { transform: rotate(0deg); }
    50% { transform: rotate(18deg); }
  }

  #mouthBouquet { transform-origin: center; transform: scale(0) rotate(-15deg); }
  #dogWrap.arrived #mouthBouquet {
    animation: bouquetBloom .7s cubic-bezier(.3,1.6,.4,1) forwards .15s;
  }
  @keyframes bouquetBloom {
    0% { transform: scale(0) rotate(-25deg); }
    70% { transform: scale(1.2) rotate(6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  footer {
    position: fixed; bottom: 10px; left: 0; right: 0; text-align: center;
    font-family: 'Great Vibes', cursive; font-size: 1.1rem; color: var(--pink-dark);
    opacity: 0; z-index: 5; transition: opacity 1s ease 2.2s;
  }
  footer.show { opacity: 0.9; }
</style>
</head>
<body>

  <h1>Para el amor de mi vida, Deborita</h1>

  <button id="loveBtn">dale click bb 💛</button>

  <div id="scene"></div>

  <div id="dogStage">
    <div id="dogWrap">
      <svg id="dogSvg" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <g id="miniFlower">
            <ellipse cx="0" cy="-8" rx="4.2" ry="8" fill="#ffd23f" transform="rotate(0)"/>
            <ellipse cx="0" cy="-8" rx="4.2" ry="8" fill="#ffd23f" transform="rotate(60)"/>
            <ellipse cx="0" cy="-8" rx="4.2" ry="8" fill="#ffd23f" transform="rotate(120)"/>
            <ellipse cx="0" cy="-8" rx="4.2" ry="8" fill="#f7a800" transform="rotate(180)"/>
            <ellipse cx="0" cy="-8" rx="4.2" ry="8" fill="#f7a800" transform="rotate(240)"/>
            <ellipse cx="0" cy="-8" rx="4.2" ry="8" fill="#ffd23f" transform="rotate(300)"/>
            <circle r="4" fill="#8a5a1e"/>
          </g>
        </defs>

        <ellipse cx="160" cy="228" rx="95" ry="10" fill="rgba(0,0,0,0.13)"/>

        <path id="tail" d="M95 150 Q40 118 55 88 Q68 128 102 155 Z" fill="#d99b4e" stroke="#c98a3c" stroke-width="2"/>

        <ellipse class="body sit-part" cx="118" cy="168" rx="60" ry="56" fill="#e3a765"/>

        <g id="legsRun" class="run-part">
          <rect id="legFF" x="150" y="176" width="14" height="46" rx="7" fill="#d99b4e" style="transform-box:fill-box; transform-origin: top center;"/>
          <rect id="legBR" x="118" y="176" width="14" height="46" rx="7" fill="#c98a3c" style="transform-box:fill-box; transform-origin: top center;"/>
          <rect id="legFR" x="182" y="176" width="14" height="46" rx="7" fill="#d99b4e" style="transform-box:fill-box; transform-origin: top center;"/>
          <rect id="legBF" x="90" y="176" width="14" height="46" rx="7" fill="#c98a3c" style="transform-box:fill-box; transform-origin: top center;"/>
        </g>

        <g id="legsSit" class="sit-part">
          <rect x="150" y="188" width="16" height="38" rx="8" fill="#d99b4e"/>
          <rect x="188" y="188" width="16" height="38" rx="8" fill="#e3a765"/>
        </g>

        <ellipse cx="178" cy="152" rx="72" ry="53" fill="#eab06e"/>
        <ellipse cx="198" cy="178" rx="31" ry="39" fill="#f7d9ab"/>

        <g id="headGroup">
          <ellipse cx="248" cy="102" rx="43" ry="41" fill="#eab06e"/>
          <path d="M227 68 Q196 60 207 107 Q228 102 235 76 Z" fill="#c98a3c"/>
          <ellipse cx="281" cy="114" rx="22" ry="17" fill="#f7d9ab"/>
          <ellipse cx="296" cy="114" rx="7" ry="6" fill="#5a3d21"/>
          <circle cx="255" cy="93" r="5.2" fill="#3a2a18"/>
          <circle cx="257" cy="91" r="1.6" fill="#fff"/>
          <path d="M272 124 Q281 130 289 124" stroke="#7a5230" stroke-width="2" fill="none" stroke-linecap="round"/>

          <g id="mouthBouquet" transform="translate(283,100)">
            <path d="M0 8 L-14 40 L14 40 Q0 20 0 8 Z" fill="#fff" opacity="0.9"/>
            <line x1="0" y1="8" x2="0" y2="38" stroke="#4caf50" stroke-width="2"/>
            <use href="#miniFlower" x="0" y="0" transform="scale(1.3)"/>
            <use href="#miniFlower" x="-9" y="4" transform="scale(1.0)"/>
            <use href="#miniFlower" x="9" y="4" transform="scale(1.0)"/>
            <use href="#miniFlower" x="-5" y="12" transform="scale(0.85)"/>
            <use href="#miniFlower" x="6" y="13" transform="scale(0.85)"/>
            <use href="#miniFlower" x="0" y="-6" transform="scale(0.8)"/>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <footer id="footerMsg">te amo infinito ✨</footer>

<script>
const btn = document.getElementById('loveBtn');
const scene = document.getElementById('scene');
const dogWrap = document.getElementById('dogWrap');
const footerMsg = document.getElementById('footerMsg');

let heartInterval = null;
let clicked = false;

const heartEmojis = ['💛','💕','💖','💗','🧡','💛'];
const flowerEmojis = ['🌼','🌻','💐','🌸'];

function spawnHeart(biasCenter) {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
  let left;
  if (biasCenter) {
    left = 35 + Math.random()*30;
  } else {
    left = Math.random()*100;
  }
  const duration = 4 + Math.random()*3;
  const drift = (Math.random()-0.5)*160;
  const spin = (Math.random()-0.5)*80;
  h.style.left = left + '%';
  h.style.animationDuration = duration + 's';
  h.style.setProperty('--drift', drift + 'px');
  h.style.setProperty('--spin', spin + 'deg');
  h.style.fontSize = (16 + Math.random()*16) + 'px';
  scene.appendChild(h);
  setTimeout(()=> h.remove(), duration*1000 + 200);
}

function burstEffect() {
  const n = 30;
  for (let i=0;i<n;i++){
    const isHeart = Math.random() > 0.3;
    const el = document.createElement('div');
    const angle = Math.random()*Math.PI*2;
    const dist = 80 + Math.random()*220;
    const bx = Math.cos(angle)*dist;
    const by = Math.sin(angle)*dist - 60;
    el.style.setProperty('--bx', bx+'px');
    el.style.setProperty('--by', by+'px');
    el.style.setProperty('--brot', (Math.random()*360-180)+'deg');
    el.style.left = (48 + Math.random()*4) + '%';
    el.style.top = (58 + Math.random()*4) + '%';
    el.style.animationDelay = (Math.random()*0.15)+'s';

    if (isHeart) {
      el.className = 'burst-heart';
      el.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
    } else {
      el.className = 'sparkle';
      el.textContent = ['✨','💫','⭐'][Math.floor(Math.random()*3)];
    }
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 1400);
  }
}

function scatterGroundFlowers() {
  const count = 16;
  for (let i=0;i<count;i++){
    const f = document.createElement('div');
    f.className = 'ground-flower';
    f.textContent = flowerEmojis[Math.floor(Math.random()*flowerEmojis.length)];
    const left = 5 + Math.random()*90;
    f.style.left = left + '%';
    f.style.bottom = (1 + Math.random()*6) + '%';
    f.style.fontSize = (18 + Math.random()*20) + 'px';
    f.style.animationDelay = (Math.random()*0.6) + 's';
    document.body.appendChild(f);
  }
}

btn.addEventListener('click', () => {
  if (clicked) return;
  clicked = true;

  btn.classList.add('hide');
  setTimeout(()=> btn.remove(), 900);

  // dog runs in
  dogWrap.classList.add('run');

  dogWrap.addEventListener('animationend', function onArrive(e){
    if (e.animationName !== 'approach') return;
    dogWrap.removeEventListener('animationend', onArrive);
    dogWrap.classList.add('arrived');

    burstEffect();
    scatterGroundFlowers();

    spawnHeart(true);
    heartInterval = setInterval(()=> spawnHeart(Math.random() > 0.4), 300);

    footerMsg.classList.add('show');
  });
});
</script>
</body>
</html>
